<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Responsive Design</title>

<!-- mediaqueries para IE8 o anterior -->
<!--[if lt IE 9]>
	<script src="http://css3-mediaqueries-js.googlecode.com/svn/trunk/css3-mediaqueries.js"></script>
<![endif]-->
<style>
	/**DEFAULT***/
	*{
		margin: 0 auto;
		padding: 0;
		box-sizing: border-box;
	}
	/***ESTILOS GENERALES***/
	div{
		border: 1px solid rgb(177, 177, 177);
		margin: 5px;
		padding: 10px 0;
	}

	#wrapper{
		width: 70vw;
		/*overflow: hidden;*/
		margin: 15px auto;
	}

	/***CABECERA***/
	#header{
		height: 180px;
	}

	/***MAIN***/
	#content{
		width: 670px;
		height: 400px;
		background-color: lightgrey;
		float: left;
	}

	#sidebar{
		width: 300px;
		height: 250px;
		background-color: lightgrey;
		float: right;
	}

	/***FOOTER***/
	#footer{
		clear: both;
	}

	/***MEDIA QUERIES***/

	/*ANCHO DE 980PX O MENOS*/
	@media (max-width: 980px){
		#wrapper{
			width: 94vw;
		}

		#content{
			width: 65%;
			margin: 0 auto;
			float: none;
		}

		#sidebar{
			width: 30%;
			margin: 0 auto;
			float: none;
		}
	}

	/*ANCHO DE 700PX O MENOS*/
	@media (max-width: 700px){
		#content, #sidebar{
			display: block;
			width: 100%;
			margin: 0;
			float: none;
		}
	}

	/*ANCHO DE 480PX O MENOS*/
	@media (max-width: 480px){
		#header{
			height: auto;
		}

		h1{
			font-size: 24px;
		}

		#sidebar{
			display: none;
		}
	}

	/*MEDIA QUERY ADICIONAL*/
	@media (min-height: 950px) {
		#wrapper{
			background-color: rgb(245, 249, 189);
		}

		#footer{
			font-size: 18px;
			color: darkgreen;
		}
	}

</style>
</head>
<body>
	<div id="wrapper">

		<div id="header">
			<h1>Cabecera</h1>
		</div>

		<div id="content">
			<h2>Contenido</h2>
		</div>

		<div id="sidebar">
			<h3>Barra lateral</h3>
		</div>
		
		<div id="footer">
			<h4>Pie</h4>
		</div>

	</div>
</body>
</html>
